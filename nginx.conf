server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Module scripts (.mjs: pdf.js, onnxruntime) are refused by browsers unless served as JavaScript
    include /etc/nginx/mime.types;
    types { text/javascript mjs; }

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript text/plain application/wasm image/svg+xml;

    include /etc/nginx/snippets/security-headers.inc;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Versioned third-party files (the version is in the path): cache for a year, never revalidate
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    # The page itself: always revalidate (ETag) so a deploy shows up at once
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # Unhashed app files (app.js, style.css, favicon.svg): short cache so deploys show up quickly
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }
}
