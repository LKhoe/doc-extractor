# doc-reader — static page served by nginx. No database or other local-infra service needed.
# Contract: local-infra/DEPLOYING-APPS.md (one service, name == image, healthcheck, no bind mounts).
services:
  doc-reader:
    container_name: doc-reader
    image: doc-reader:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only: the tunnel reaches the app over the Docker network, not this port. From
      # another machine use an SSH tunnel (ssh -L 3004:127.0.0.1:3004 umbrel).
      - "127.0.0.1:${PORT:-3004}:3000"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      # Shown on the Container Health page (resource map: the app's icon and link)
      - localinfra.url=${APP_URL:-https://doc-reader.khoe.dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # Public access through local-infra's Cloudflare tunnel: http://doc-reader:3000
      - localinfra_tunnel
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  localinfra_tunnel:
    external: true
